[project]
name = "react"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==1.13.1",
    "torchvision==0.14.1",
    "alfworld===0.3.1",
    "fast-downward-textworld==20.6.1",
    "notebook===6.5.3",
    "openai==0.27.0",
    "ipywidgets>=8.1.9",
]

[tool.uv]
override-dependencies = [
    "fast-downward-textworld==20.6.1"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
